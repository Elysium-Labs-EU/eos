# yaml-language-server: $schema=https://raw.githubusercontent.com/Elysium-Labs-EU/argus/main/schemas/config.schema.json
# .argus/config.yml — all keys are optional; see `argus init`.
base_branch: "main"
# Nest each spawned worker as a tab in the supervising session's workspace
# instead of argus's default of a fresh top-level workspace per worker. Three
# concurrent workers otherwise scatter across three workspaces the supervisor
# has to hunt for, and ownership already keys off the same workspace id.
worker_placement: "tab"
# .gitnexus/ is gitignored, so a fresh worktree has no index and `make adr-find`
# loses its related-code section. Link the original checkout's rather than
# rebuilding one per worker: the index is read-only here and several workers
# share it concurrently. Never fail worktree creation over it.
worktree_bootstrap_command: "main=$(dirname \"$(git rev-parse --git-common-dir)\"); if [ -d \"$main/.gitnexus\" ] && [ ! -e .gitnexus ]; then ln -sfn \"$main/.gitnexus\" .gitnexus; fi; exit 0"
brief_note: "Coverage: new code you add or modify must average >=90% per-function line coverage. A gate re-checks this against origin/main once you reach a terminal phase and hard-escalates on a miss, so write tests alongside the code rather than after.\n\nReal-world verification: eos supervises real OS processes, so passing unit tests is never sufficient evidence that a lifecycle change works. If you touch service spawn/stop/restart, the health monitor, liveness checks, the daemon, or the installer, you must exercise the change against a real service on a real Linux VM and put what you observed in your report's real_world_proof field. The gate hard-escalates an empty real_world_proof on those paths.\n\nHow to do that here:\n  make release-local        build the linux binary the VM installs\n  make test-fixtures-orb    real nextjs/vite/express/hono fixtures, ORB_MACHINE=debian\n  orb -m debian <cmd>       ad-hoc probing inside the VM\n\nUse a VM whose daemon is actually supervised (`eos system startup --yes` plus `systemctl --user start eos`), not a bare `eos daemon start` - several defects in this area only appear in the managed-daemon configuration.\n\nreal_world_proof must contain observations, not intentions: the actual command you ran, the actual `ps -eo pid,ppid,pgid,args` / `ss -lnt` / `eos api status` output, and the before-and-after difference. \"Verified on debian\" is not proof and will be sent back.\n\nNever run the fixtures straight out of testdata/fixtures on a shared path. That directory is the macOS host's working copy mounted into every OrbStack VM at once, so two VMs running it concurrently share one .next build and one node_modules and produce garbage results. scripts/test-fixtures-orb.sh already copies to a VM-local SCRATCH_DIR for this reason; do the same for anything you run by hand.\n\nGATES THAT DO NOT RUN IN make ci - each has already cost a wasted rework round, so verify them yourself before reporting:\n1. CRAP and diff-size gates no-op on an uncommitted tree, and you cannot commit: git commit and git push are denied to you in every phase, because argus creates the commit itself once your report lands. So there is no way for you to exercise these two gates locally, and a green make ci says nothing about them. They fire at ship time against argus's commit and block the push. What protects you is keeping every function you add small enough to be covered, and exercising every branch you add - including error returns - in tests. Keep the diff focused for the same reason: unrelated drive-by edits are what push a change past the diff-size gate and past the review gate's own line ceiling.\n2. Typo checking (crate-ci/typos) is a CI job, not part of make ci. Run `typos` over the worktree if the binary is present, otherwise re-read your own added lines for misspellings before reporting.\n3. Integration tests sit behind `-tags integration` and are never compiled by make ci or make test-linux. If you touch supervision, the daemon, or process lifecycle, run them: orb run -m debian bash -lc \"cd <worktree> && sudo env PATH=$PATH go test ./cmd/... -tags integration -count=1 -run Supervised\". Unrelated integration tests currently fail on the debian VM for environmental reasons, so keep the -run filter targeted to avoid that noise.\n4. SonarCloud enforces >=80 percent coverage on NEW code as a separate PR check. It is not make ci's total-coverage gate and not the per-function bar above; a change can satisfy both and still fail Sonar. Before reporting, make sure every new branch you added is exercised - error returns included, since those are the lines most often left uncovered.\n\nMERGE MAIN BEFORE YOU REPORT, AND REPORT THE SIZE GIT MEASURES. Two failures cost a full round each in this repo and both are avoidable in thirty seconds.\n\nFirst, main moves while you work. A worktree that predates a merge shows every file that merge touched as though you deleted it, and a reviewer will correctly request changes over an unrelated revert you never made. Before reporting, run these two commands SEPARATELY, each exactly as written:\n\n  git fetch origin main\n  git merge origin/main --no-commit\n\nYour allow set matches by command prefix, so chaining them as `git fetch origin main && git merge origin/main --no-commit` matches neither entry and is denied outright. Two separate calls, nothing appended. Then check `git diff --stat origin/main` and confirm the only files listed are ones you actually changed.\n\nSecond, the gate measures your diff itself and compares it to the size you claimed. A material under-report is unwaivable no matter how good the code is. Do not estimate the number and do not carry one over from earlier in your work: as the last thing you do before reporting, run `git diff --shortstat origin/main` and copy its insertions and deletions verbatim.\n\nREPORTING IS A ONE-LINE COMMAND. Pass the JSON body as a bash herestring, never a heredoc:\n\n  argus worker report planning <<< '{\"task\":\"...\",\"plan\":[\"...\"]}'\n\nYour allow set matches by command prefix and a prefix glob does not match across a newline, so the multi-line heredoc form is denied outright by the permission layer - not by argus's hook, which accepts it. The denial reads \"Permission to use Bash has been denied because Claude Code is running in don't ask mode\" and looks like a missing permission rather than a syntax problem. In planning you cannot create a file either, so --file is not a way out and there is no legal multi-line path. One line, herestring, every time.\n\nCOMMENT STYLE, enforced on every diff: never cite an issue number anywhere you author - not in code comments, not in test function names, not in commit messages, not in PR bodies. State the reason directly rather than pointing at a ticket. The only exception is the `Closes #N` trailer, which argus adds itself. Comments must be dense and explain WHY, never restate WHAT the code does.\n\nREPORTING YOUR TESTS: list narrow, fast, self-contained commands only. Never list `make ci` in the tests array - argus re-runs every claimed command under a 5 minute cap while gate_verify_command already runs make ci separately with a longer bound, so claiming it buys nothing and fails the moment the machine is loaded. Do not use make variables in a claimed command either (`make test-linux-single TEST=X` is re-run as bare `make test-linux-single` and fails); write the full command instead, e.g. orb run -m debian bash -lc \"cd <worktree> && go test ./cmd -run TestX\".\n\nARCHITECTURE DECISIONS: docs/adr/ is this repo's permanent design record, and an accepted ADR is binding. Before you write code, run `make adr-find Q=\"<your topic>\"` and read whatever it returns; silently contradicting an accepted ADR is a request-changes. If your change MAKES a design decision - replaces a heuristic, introduces a new concept into the model, changes a contract, or rejects an alternative for a stated reason - write an ADR in the same diff: name it with a datetimestamp id of the form DDMMYYHHMM (day, month, two-digit year, hour, minute, 24h; e.g. docs/adr/1408260745-slug.md), which self-allocates a unique id so parallel workers never collide, in the format defined by docs/adr/0001-record-architecture-decisions.md (Context, Decision, Rejected, Consequences; bullets not prose; 15 to 30 lines; no issue numbers). The directory listing is the index; there is no index file to update. A bug fix, a test-only change, or anything that follows an existing pattern does NOT get an ADR - do not add one defensively; reserve ADRs for genuine design decisions. Either way, state in your report which case applies and why. Reversing an accepted ADR means a NEW ADR that supersedes it; never edit or delete an accepted file.\n\nQUOTING orb COMMANDS: write the inner script in SINGLE quotes so it expands inside the VM, not on the macOS host. `orb run -m debian bash -lc \"export PATH=/usr/local/go/bin:$PATH; go test ...\"` expands $PATH on the host and injects the macOS PATH into the VM. OrbStack mounts /Applications into the guest, so gcc then resolves to /Applications/Xcode.app/Contents/Developer/usr/bin/gcc instead of /usr/bin/gcc, and every cgo build dies with \"clang: error: no such file or directory: /tmp/cgo-gcc-input-*.c\" because the macOS compiler cannot see the VM's /tmp. Use orb run -m debian bash -lc 'export PATH=/usr/local/go/bin:$PATH; cd <worktree> && go test ...' instead, and always `cd` explicitly rather than relying on an inherited working directory.\n\nRESOLVING A CONFLICT IS TWO STEPS AND ONLY THE FIRST ONE IS VISIBLE. After you fix the conflicting content, `git add` the file. A path stays UU in `git status` until you stage it, even when the file itself is already correct and has no markers left, and argus creates the commit itself at ship time - `git commit` refuses outright while any path is unmerged, so an unstaged resolution fails the whole change at the last step. Two workers hit this in one afternoon, both with correct content. Before reporting, run `git status` and confirm nothing is left in UU.\n\nTHE DEBIAN VM IS SHARED WITH EVERY OTHER WORKER RUNNING RIGHT NOW. It has one installed eos binary and one daemon database, so a sibling worker testing a schema migration moves the daemon past your branch's schema, and installing your own build replaces theirs mid-verification. This already happened: a worker found the shared daemon migrated beyond its branch, broke it while testing, and had to borrow the sibling's migration file to recover. Before you conclude the VM proves something about your change, check that what you are looking at is your build and not a sibling's. Never commit a file you copied in to recover shared state, and say in your report if you disturbed the VM so the next worker is not debugging your leftovers."

review:
  gate_verify_command: "make ci && make test-supervision-orb"
  # Raised from argus's 400 default, which fired on every change in a five-change
  # wave (591, 857, 548, 628 lines) and so had stopped discriminating. The count
  # is insertions+deletions across the whole diff with no way to exclude paths,
  # and this repo requires an ADR plus >=90% per-function coverage on new code,
  # so tests and the ADR routinely outweigh the code they document. 800 clears a
  # normal change of that shape while still catching the outlier that spanned the
  # monitor, the database and a migration at once.
  max_diff_lines: 800
  proof_required_paths:
    - "internal/manager"
    - "internal/monitor"
    - "internal/process"
    - "internal/procutil"
    - "cmd/root.go"
    - "cmd/daemon.go"
    - "cmd/system.go"
    - "cmd/run.go"
    - "cmd/stop.go"
    - "cmd/api_run.go"
    - "cmd/api_stop.go"
    - "install.sh"
    - "scripts/"
  always_review_paths:
    - "cmd/root.go"
    - "cmd/system.go"
    - "internal/process/daemon.go"
    - "install.sh"
  review_note: "eos supervises real OS processes. Treat unit tests and dry-runs as necessary but never sufficient for any change to spawn/stop/restart, the health monitor, liveness checks, the daemon or the installer.\n\nDo NOT ask for, or fail a change over, the worker's real_world_proof report field - your prompt does not contain it, so you cannot see it even when it is populated, and rejecting on that basis produces false request-changes. Real-world verification is now executed mechanically by the gate: gate_verify_command runs make test-supervision-orb, which runs the supervision integration tests against a real systemd unit on a Linux VM. If the gate passed, that verification passed.\n\nJudge what you can actually see: the diff. For lifecycle changes, expect the evidence to live IN the diff as a test behind the integration build tag that asserts from the OS - /proc, ps, pgid, socket ownership - rather than from eos's own reporting. A lifecycle change with no such test is a legitimate request-changes.\n\nBEFORE YOU CALL ANYTHING A REVERT, CHECK THE MERGE BASE. The diff you are shown is computed tip-to-tip against origin/main. If main moved after this branch was created - which it usually has - every file those newer commits touched shows up in the diff as though this branch deleted or reverted it, even though the branch never touched it and git will not revert anything on merge. This has already produced two false request-changes verdicts in this repo. A file that appears reverted, is unrelated to the stated task, and is not mentioned in the worker's report is almost certainly this artifact. Judge the branch on the changes it actually makes to files within its own scope, and do not fail a change for reverting something it did not touch.\n\nARCHITECTURE DECISIONS: docs/adr/ is the binding design record. If the diff makes a design decision - replaces a heuristic, introduces a new concept into the model, changes a contract, or rejects an alternative - expect an ADR file in the same diff, and check that the ADR's stated Decision actually matches the code. There is no ADR index file; do not request one. A bug fix that follows an existing pattern needs no ADR. Also check the diff does not silently contradict an already-accepted ADR; a reversal requires a new superseding ADR, never an edit to the old file.\n\nWatch specifically for: a service ending up parented by the CLI instead of the daemon, a pgid reported to the caller that does not match the surviving process group, a service's stdout/stderr pipe left without a live reader, and any path where a still-running process can be reported as stopped."

phases:
  working:
    allow:
      - "Bash(make *)"
      - "Bash(git rm *)"
      - "Bash(git add *)"
      - "Bash(orb *)"
      # brief_note requires both of these before reporting, so they have to be
      # reachable or the instruction is one a worker can only fail. Scoped to
      # origin/main and to --no-commit: a bare `git merge` would create the
      # commit argus makes itself at ship time.
      - "Bash(git fetch origin main*)"
      - "Bash(git merge origin/main --no-commit*)"
  self_test:
    allow:
      - "Bash(make *)"
      - "Bash(orb *)"
      - "Bash(git fetch origin main*)"
      - "Bash(git merge origin/main --no-commit*)"
