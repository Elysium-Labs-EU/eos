title = "eos gitleaks config"

# Extend gitleaks' default ruleset rather than replacing it.
[extend]
useDefault = true

# Narrowly-scoped global allowlist. These four regexes match known-fake,
# non-credential test-fixture strings — a generic api-key-shaped string, an
# AWS-access-key-shaped string, and PEM-private-key-shaped body content —
# that trip gitleaks' pattern/entropy rules. They're added here specifically
# because a sibling, still-open PR's test fixtures already contain them, and
# gitleaks scans full git history across all locally-reachable branches/refs
# by default, not just this branch's own tree — so without this file, this
# branch's own CI would be blocked by that PR's already-fixed, not-yet-merged
# false positive, regardless of which of the two merges first. None of these
# strings are real credentials, and nothing here asserts they live in a file
# that exists in this branch's own tree right now.
#
# Deliberately not a path-based exemption for a whole file: that would risk
# silently masking a real secret added to this branch later. These regexes
# match only the four known-fake literal values.
[allowlist]
description = "Known-fake credential-shaped test-fixture strings from a sibling PR's test suite — not real secrets, not present in this branch's own tree"
regexes = [
  '''sk-abc123def456''',
  '''AKIAABCDEFGHIJKLMNOP''',
  '''MIIBOgIBAAJBAK8z9x8example1''',
  '''MIIBOgIBAAJBAK8z9x8example2''',
]
