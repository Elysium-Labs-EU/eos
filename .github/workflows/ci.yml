name: CI

# The ci job calls `task ci` directly rather than re-declaring each check in
# YAML: Taskfile.yml is the single source of truth for what "passing" means
# (test, lint, ast-grep, nilaway, coverage floor, go-crap change-risk gate),
# so this workflow can't silently drift from it -- previously this job only
# ran a hand-copied subset (test + coverage), skipping lint, ast-grep,
# nilaway, and the crap gate entirely on every push and PR.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  typos:
    name: Typo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for typos
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1

  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # go-crap-gate diffs changed functions against origin/main

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # task setup:setup does not install ast-grep (the sg target expects it
      # preinstalled, e.g. via brew locally); the npm package is the simplest
      # reliable install on a GitHub-hosted runner (node is preinstalled).
      # Version pinned (not a floating tag) and --ignore-scripts blocks
      # install-time lifecycle scripts from running.
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.45.0 --ignore-scripts

      # Pinned to the commit for v3.53.1 (not the floating tag) so SonarCloud's
      # dependency-predictability check treats this the same as the SHA-pinned
      # actions/cache step below. go-task has no version file the way
      # golangci-lint does -- bump this deliberately, not implicitly via @latest.
      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@a10322cd63f94d8bc8b48bb5c0e80eec10eda1e7 # v3.53.1

      # ~/go/pkg/mod and ~/.cache/go-build are already cached by actions/setup-go;
      # ~/go/bin (the installed tool binaries themselves) is not, and `task setup`
      # was taking ~4.5min per run reinstalling golangci-lint/nilaway/go-crap/
      # gitleaks/govulncheck from scratch every time. Keyed on Taskfile.yml +
      # taskfiles/** + go.mod so a tool-version bump OR a go directive bump
      # (which rebuilds go-installed tools like nilaway against a different
      # toolchain) still invalidates the cache correctly. No restore-keys
      # fallback: most of these tools (nilaway, go-crap, gitleaks, ...) are
      # presence-only checked by install-tool-go, so a fallback hit on a stale
      # prefix would restore binaries built against the old toolchain and
      # `task setup:setup` would skip reinstalling them since they "exist".
      - name: Cache dev tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: devtools-${{ runner.os }}-${{ hashFiles('Taskfile.yml', 'taskfiles/**', 'go.mod') }}

      - name: Install dev tools
        run: task setup:setup

      - name: Run CI gate
        run: task ci

  integration-test:
    name: Integration Test (root + systemd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      # Root + systemd as PID 1 are required: these tests fork/exec with a
      # dropped-privilege child and manage real systemd units (under an
      # isolated unit name, never the real "eos" unit — see
      # cmd/system_integration_test.go). GitHub-hosted ubuntu-latest runners
      # are full VMs with systemd, so this replicates a real install target;
      # `go test` itself isn't run as root by default, hence the sudo.
      - name: Run integration tests
        run: sudo env "PATH=$PATH" go test ./cmd/... -tags integration -v -count=1

  verify-build:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Verify code compiles
        run: go build -v ./...
