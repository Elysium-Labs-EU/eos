sonar.projectKey=Elysium-Labs-EU_eos
sonar.organization=elysium-labs-eu

sonar.sources=.
sonar.exclusions=**/*_test.go,**/__benchmarks__/**,testdata/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out

# go:S2077 (dynamically formatted SQL query) false positive: internal/database/database.go
# builds UPDATE ... SET clauses via fmt.Sprintf, but only with fixed string literals
# gated behind compile-time struct fields (ProcessHistoryUpdate/ServiceInstanceUpdate) and
# checked against an allowlist (processHistoryValidColumns/serviceInstanceValidColumns)
# just above each call. Every actual value goes through args as a bind parameter, never
# through Sprintf. No caller, HTTP input, CLI input, or config can reach the interpolated
# part. Already documented and suppressed for gosec via "#nosec G201" at the two call
# sites (database.go:616, database.go:803); this scopes the same justification to
# SonarCloud, which does not honor #nosec.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e1.resourceKey=internal/database/database.go
